name: Sync Luban Tools

# 轮询 luban 仓库,main 分支有新提交时重新构建 Luban 并同步产物到 Tools/。
# 零凭证设计:匿名读公开的 luban 仓库,用本仓库默认 GITHUB_TOKEN 提交。
# 上次同步的 SHA 记在 sync commit message 的 Luban-Sha trailer 里,不落额外文件。
# 每天定时检查;无变化时整个 workflow 只做一次 git ls-remote,秒级完成。
# 需要立即同步时可手动 workflow_dispatch 触发(可勾选强制重建)。

on:
  schedule:
    # 每天一次,UTC 21:37 = 北京时间 05:37,早上开工前完成同步
    - cron: "37 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重建(忽略 SHA 检查)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-luban-tools
  cancel-in-progress: false

env:
  LUBAN_REPO: GameFrameX/luban

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Config
        uses: actions/checkout@v4
        with:
          # 完整历史:检查步骤要从最近一次 sync commit 的 trailer 读上次同步的 SHA
          fetch-depth: 0

      - name: Resolve latest luban commit
        id: luban
        run: |
          sha=$(git ls-remote "https://github.com/${LUBAN_REPO}.git" refs/heads/main | cut -f1)
          if [ -z "$sha" ]; then
            echo "failed to resolve luban main HEAD" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "luban main HEAD: $sha"

      - name: Check if sync needed
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=$(git log -1 --format='%(trailers:key=Luban-Sha,valueonly)' --grep='^chore(tools): sync luban build')
          echo "last synced: ${last:-<none>}"
          if [ "$FORCE" = "true" ] || [ "$last" != "${{ steps.luban.outputs.sha }}" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "already up to date, skipping build"
          fi

      - name: Checkout luban
        if: steps.check.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LUBAN_REPO }}
          ref: ${{ steps.luban.outputs.sha }}
          path: luban

      - name: Setup .NET
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Luban
        if: steps.check.outputs.needed == 'true'
        run: dotnet publish luban/src/Luban -c Release -o publish -p:UseAppHost=false --nologo

      - name: Sync Tools
        if: steps.check.outputs.needed == 'true'
        run: rsync -a --delete publish/ Tools/

      - name: Commit and push
        if: steps.check.outputs.needed == 'true'
        env:
          LUBAN_SHA: ${{ steps.luban.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tools
          if git diff --cached --quiet; then
            echo "build produced no file changes"
            exit 0
          fi
          short=${LUBAN_SHA:0:7}
          git commit -m "chore(tools): sync luban build ${short}" -m "Luban-Sha: ${LUBAN_SHA}"
          git push
