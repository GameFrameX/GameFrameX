name: Metrics Collect

# 每日采集 8 仓流量数据（GitHub Traffic API 只保留 14 天，不可断档）。
# 依赖 secret：METRICS_PAT（fine-grained PAT，8 仓 Contents:Read + Metadata）。

on:
  schedule:
    - cron: "0 17 * * *"     # 每日 UTC 17（北京凌晨 1 点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect & append
        env:
          GH_TOKEN: "${{ secrets.METRICS_PAT }}"
        run: bash scripts/metrics-collect.sh metrics
      - name: Commit
        run: |
          git config user.name "gameframex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git diff --cached --quiet || git commit -m "chore(metrics): daily snapshot [skip ci]"
          git push
