name: PAT Debug

# 临时诊断：输出 secret 中 token 的指纹（不泄露值），并逐条测试 metrics 采集链路的 API 端点。
# 诊断完成后此 workflow 可删除。

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint and endpoint test
        env:
          GH_TOKEN: "${{ secrets.METRICS_PAT }}"
        run: |
          echo "token length: ${#GH_TOKEN}"
          echo "token fingerprint (sha256 first 12): $(echo -n "$GH_TOKEN" | sha256sum | cut -c1-12)"
          echo "--- 1. who does this token act as ---"
          gh api user --jq '"OK login: \(.login)"' 2>&1 || true
          echo "--- 2. repo metadata (public repo, low bar) ---"
          gh api repos/GameFrameX/GameFrameX --jq '"OK repo: \(.full_name)"' 2>&1 || true
          echo "--- 3. traffic views (the real permission test) ---"
          gh api repos/GameFrameX/GameFrameX/traffic/views --jq '"OK views 14d count: \(.count)"' 2>&1 || true
          echo "--- 4. traffic 403 response body ---"
          gh api repos/GameFrameX/GameFrameX/traffic/views -i 2>&1 | grep -A3 -iE "^HTTP|^x-github-sso|^x-audit" || echo "(no response captured)"
